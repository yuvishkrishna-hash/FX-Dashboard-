name: Build and deploy FX dashboard

# 22:30 UTC Monday–Friday is 00:30 SAST Tuesday–Saturday, after the FX daily close.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main

# contents: read checks out the repo. actions: read lets deploy-pages
# download the artifact. pages + id-token publish the site.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: fx-dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the FX research pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
